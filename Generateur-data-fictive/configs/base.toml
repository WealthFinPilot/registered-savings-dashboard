# Configuration de base du générateur synthétique. Toutes les valeurs sont des paramètres de
# distributions ou des règles de mandat : aucune n'est une donnée réelle, aucune n'est un résultat
# attendu. Les scénarios (typical.toml…) héritent de ce fichier par « extends » et en surchargent
# une partie.
#
# Conventions : pourcentages de 0 à 100 ; parts (risk_appetite, poids) de 0 à 1 ; durées en mois
# sauf mention ; [min, max] = bornes d'un tirage uniforme ; [moyenne, écart-type] = loi normale.

[scenario]
name = "base"
start_date = 2021-11-01
end_date = 2026-10-30
base_currency = "CAD"
seed = 20261103

[universe]
fund_count = [12, 18]                  # bornes de contrôle sur le total des fonds
regimes = ["CELI", "CELIAPP", "REER", "COMP"]
celiapp_available_from = 2023-04-01    # premier jour d'ouverture possible d'un CELIAPP
fee_tier_threshold_cad = 100000        # palier des frais de compte, actif du ménage par institution
new_fund_probability = 0.12            # part des fonds lancés pendant l'horizon
new_fund_window_days = [90, 900]       # lancement : jours après start_date
old_fund_age_days = [365, 7300]        # ancienneté d'un fonds déjà existant au départ
# Poids d'épargne a priori des institutions : logistique-normale tronquée. Les biais décalent la
# moyenne du logit de chaque profil ; la troncature rejette tout tirage sous min_institution_weight.
institution_weight_sigma = 0.55
min_institution_weight = 0.10
equal_split_tolerance = 0.02           # rejet aussi si toutes les parts sont à moins de 2 points de 1/3
first_institution_reason = "héritage de produits"
# Appétits pour le risque (part en actions visée) : tirés ensemble, rejetés s'ils ne respectent pas
# l'ordre des profils prudent < intermédiaire < dynamique avec cet écart minimal. C'est la définition
# des profils, pas un résultat imposé : la part réalisée dépend ensuite de la gamme et de l'arrondi.
min_appetite_gap = 0.10

[accounts]
min_per_institution = 2
first_opening_window_days = 45         # ouverture du premier compte après start_date
institution_delay_months = 14          # délai exponentiel d'ouverture des institutions suivantes
institution_delay_max_months = 30
account_delay_months = 9               # délai exponentiel d'un compte après l'ouverture de l'institution
celiapp_delay_months = 4               # délai exponentiel après celiapp_available_from
last_opening_before_end_months = 12    # aucun compte ouvert dans la dernière année

[accounts.count]                       # nombre de comptes par régime, [min, max]
CELI = [2, 3]
CELIAPP = [1, 1]
REER = [1, 2]
COMP = [1, 2]

[policy]
# Gamme d'une institution : un archétype « cœur » de son profil, puis les autres au prorata de
# archetype_affinity ; le fonds cœur existe toujours au départ. Allocation cible : préférences tirées
# en Dirichlet(preference_concentration), puis inclinaison exponentielle minimale pour que la part
# en actions égale l'appétit tiré (ou l'extrême atteignable par la gamme). Arrondie au pas de
# rounding_step %, les poids sous un demi-pas abandonnés.
preference_concentration = 1.0
rounding_step = 5
# Comptes : sous-ensemble des fonds de la politique, poids perturbés (log-normale), même pas.
account_funds = [2, 4]
account_weight_sigma = 0.35

# --------------------------------------------------------------------------------------------
# Institutions : intention de départ. Le risque réel se lit ensuite dans les expositions.
# --------------------------------------------------------------------------------------------
[[institutions]]
name = "Société 1"
strategy_profile = "balanced"
risk_appetite = [0.60, 0.06]           # part en actions visée par l'investisseur dans cette institution
fund_count = [4, 6]
fee_level = [0.0, 0.08]                # multiplicateur log-normal des frais : [mu, sigma]
savings_bias = 0.15                    # décalage du logit du poids d'épargne
reasons = ["portefeuilles clés en main", "simplicité de gestion"]
core_archetypes = ["equilibre"]        # au moins un, existant au départ : il permet d'atteindre le profil
archetype_affinity = { equilibre = 1.0, croissance = 0.8, actions_mondiales = 0.9, actions_canadiennes = 0.6, obligations_canadiennes = 0.6, dividendes_canadiens = 0.4, actions_internationales = 0.5, conservateur = 0.3, monetaire = 0.3 }
regime_affinity = { CELI = 1.0, REER = 0.8, COMP = 0.5, CELIAPP = 0.4 }

[[institutions]]
name = "Société 2"
strategy_profile = "prudent"
risk_appetite = [0.33, 0.06]
fund_count = [4, 6]
fee_level = [-0.12, 0.08]
savings_bias = 0.0
reasons = ["frais bas", "proximité d'un conseiller"]
core_archetypes = ["conservateur"]
archetype_affinity = { monetaire = 1.0, obligations_canadiennes = 1.0, obligations_mondiales = 0.6, conservateur = 1.0, equilibre = 0.7, dividendes_canadiens = 0.5, actions_mondiales = 0.3, actifs_reels = 0.4 }
regime_affinity = { REER = 1.0, CELIAPP = 1.0, CELI = 0.8, COMP = 0.3 }

[[institutions]]
name = "Société 3"
strategy_profile = "growth"
risk_appetite = [0.88, 0.05]
fund_count = [4, 6]
fee_level = [0.10, 0.10]
savings_bias = -0.10
reasons = ["changement de stratégie", "choix de fonds spécialisés"]
core_archetypes = ["actions_mondiales", "actions_americaines", "marches_emergents", "technologie_mondiale", "petites_cap_nord_americaines"]
archetype_affinity = { actions_mondiales = 0.9, actions_americaines = 0.8, marches_emergents = 0.7, petites_cap_nord_americaines = 0.7, technologie_mondiale = 0.5, actions_canadiennes = 0.6, croissance = 0.5, actions_internationales = 0.5, monetaire = 0.2 }
regime_affinity = { COMP = 1.0, CELI = 0.9, REER = 0.5, CELIAPP = 0.3 }


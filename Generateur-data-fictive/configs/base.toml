# --------------------------------------------------------------------------------------------
# Personnage fictif (mode fiscal conservative_synthetic). Les plafonds ne s'écrivent pas ici : ils
# sont relus dans sql/plafonds.sql du projet (droit public). Seule la situation personnelle est tirée.
# --------------------------------------------------------------------------------------------
[persona]
celi_first_year = [2012, 2021]         # première année d'admissibilité au CELI, entier uniforme
earned_income = [64000, 0.20]          # revenu gagné de l'année précédant l'horizon : [médiane, sigma log]
income_growth_pct = [2.5, 2.0]         # croissance annuelle du revenu : [moyenne, écart-type]
reer_opening_unused = [0, 12000]       # droits REER inutilisés à la fin de l'année précédant l'horizon
marginal_tax_rate = [0.26, 0.38]       # taux marginal fictif, pour le remboursement d'impôt des cotisations REER

# --------------------------------------------------------------------------------------------
# Comportement de l'épargnant (moteur C). Une capacité d'épargne latente, qui ne bouge qu'à des
# décisions datées (phases, révisions, ajustements) ; des PAC programmés par compte, constants entre
# deux décisions ; des mois atypiques, des ponctuels et des retraits tirés de processus de Poisson.
# Le marché n'est lu que dans le passé : repli du repère actions mondiales arrêté la veille.
# Montants en CAD ; [médiane, sigma] = loi log-normale ; poids = loi catégorielle (normalisée).
# --------------------------------------------------------------------------------------------
[behaviour]
monthly_capacity = [700, 0.15]         # capacité mensuelle de départ, tout le patrimoine
revision_noise_sigma = 0.03            # bruit log de la capacité à chaque révision des PAC
phase_count = [2, 5]                   # phases d'épargne sur l'horizon, entier uniforme
phase_min_gap_months = 5
phase_window_months = [3, 3]           # aucune phase dans les n premiers et n derniers mois
# Multiplicateur de capacité par type de phase ([min, max] uniforme). Rappel budgétaire : le poids des
# phases qui montent est multiplié par (capacité / départ)^−phase_reversion, celui des phases qui baissent
# par (capacité / départ)^+phase_reversion ; au-dessus du départ, une pression devient plus probable.
phase_multiplier = { hausse_revenus = [1.08, 1.30], pression_budgetaire = [0.65, 0.90], nouveau_projet = [0.85, 1.00], reprise_epargne = [1.05, 1.25] }
phase_weights = { hausse_revenus = 0.30, pression_budgetaire = 0.25, nouveau_projet = 0.25, reprise_epargne = 0.20 }
phase_reversion = 4.0
project_celiapp_boost = 2.0            # nouveau projet : poids d'épargne des CELIAPP multiplié
# Ventilation entre comptes : le poids d'épargne a priori de l'institution (J1) se partage entre ses comptes
# alimentés au prorata de l'affinité du régime, × une log-normale propre au compte (marche aléatoire à
# chaque révision). Certains comptes n'ont pas de PAC.
account_weight_sigma = 0.5
account_weight_drift_sigma = 0.15
no_pac_probability = 0.15
min_pac = 25
pac_rounding = { "5" = 0.30, "10" = 0.40, "25" = 0.20, "50" = 0.10 }   # pas d'arrondi tiré à chaque révision
pac_day = [1, 28]                      # jour du prélèvement, tiré par compte (reporté au jour ouvrable)
adjustment_rate_per_year = 0.8         # petit ajustement du PAC d'un compte
adjustment_sigma = 0.15
# Mois atypiques (tous les comptes) et pauses (un compte)
atypical_rate_per_year = 0.7
atypical_types = { suspension = 0.40, reduction = 0.40, report = 0.20 }
reduction_factor = [0.40, 0.70]
report_days = [4, 15]
pause_rate_per_year = 0.2
pause_months = [1, 4]
# Ponctuels : nombre mensuel de Poisson, saisonnalité en tendance ; montant en mois de capacité
lump_rate_per_year = 1.1
lump_month_weights = [1.6, 1.4, 0.9, 0.9, 0.9, 0.8, 0.8, 0.8, 0.9, 0.9, 1.0, 1.3]
lump_types = { prime = 0.40, argent_disponible = 0.35, cadeau = 0.25 }
lump_capacity_multiple = { prime = [2.5, 0.5], argent_disponible = [1.2, 0.5], cadeau = [0.8, 0.6] }
lump_bounds_capacity_multiple = [0.15, 8.0]   # tirage rejeté hors de ces multiples de la capacité…
lump_bounds_cad = [100, 9000]          # … ou hors de ces montants
lump_rounding = { "1" = 0.25, "10" = 0.35, "50" = 0.25, "100" = 0.15 }
reer_season_boost = 2.0                # janvier-février : un ponctuel va plus souvent au REER
celi_january_boost = 1.5
refund_probability = 0.8               # remboursement d'impôt des cotisations REER de l'année de déduction
refund_months = [4, 6]
# Retraits : besoin de liquidités ; CELI et COMP seulement, au plus withdrawal_max_share des apports nets
withdrawal_rate_per_year = 0.3
withdrawal_capacity_multiple = [2.0, 0.6]
withdrawal_max_share = 0.5
withdrawal_min_cad = 100
# Révisions de cible des comptes : revue annuelle avec inertie, prudence passagère après une baisse
review_month_weights = [2.0, 1.5, 1.0, 0.8, 0.8, 0.6, 0.5, 0.6, 1.0, 1.0, 1.0, 1.2]
review_change_probability = 0.35
review_sigma = 0.30
review_pac_probability = 0.5           # la revue ajuste aussi le PAC du compte
new_fund_adoption_probability = 0.5    # un fonds lancé depuis la dernière cible entre à la revue
prudence_drawdown_pct = -15            # repli du repère actions mondiales qui inquiète l'épargnant
prudence_monthly_probability = 0.35
prudence_equity_shift = 0.15           # baisse visée de la part en actions du compte le plus exposé
prudence_min_equity_drop = 0.05        # baisse effective minimale ; en deçà, la gamme ne permet pas de se protéger
prudence_duration_months = 9           # durée moyenne avant le retour à la cible (géométrique)

# --------------------------------------------------------------------------------------------
# Grand livre (moteur D). Apports investis le jour même à la VL de clôture ; frais de compte mensuels au
# taux du fonds, sous ou au-delà du palier universe.fee_tier_threshold_cad. Rééquilibrages imparfaits :
# à chaque nouvelle cible du J3, et quand un regard sur la dérive (½ Σ |poids − cible|, en points, à la
# clôture de la veille) la trouve au-delà du seuil du compte. Entre deux regards, la dérive court.
# --------------------------------------------------------------------------------------------
[ledger]
drift_threshold_pts = [3.0, 6.0]       # seuil de dérive tiré par compte, uniforme (dérive médiane ~1,5 point)
drift_check_months = 6                 # intervalle moyen entre deux regards (loi géométrique, en mois)
rebalance_fraction = [0.4, 0.9]        # part de l'écart corrigée par un rééquilibrage incomplet, uniforme
full_rebalance_probability = 0.3       # sinon, rééquilibrage incomplet
rebalance_min_cad = 100                # échange plus petit : pas fait

# --------------------------------------------------------------------------------------------
# Mesures (moteur E), calculées après la simulation sur le seul grand livre : rien n'est tiré ici.
# TWR quotidien chaîné (V⁻ₜ = V⁺ₜ − flux du jour) ; MWR (XIRR, années de 365 jours) par année civile et
# depuis l'ouverture ; contrefactuel passif qui reçoit les mêmes flux externes aux mêmes dates.
# --------------------------------------------------------------------------------------------
[performance]
mwr_bounds = [-0.99, 10.0]             # taux cherché dans cet intervalle (période ou année) ; au-delà : non convergé
mwr_grid = 400                         # points de grille en log(1 + taux) : chaque changement de signe = une racine
annualize_min_days = 365               # période plus courte : taux de la période, non annualisé
context_benchmarks = ["R-ACT-MONDE", "R-EQUILIBRE"]   # contrefactuels de contexte, sur tous les flux du portefeuille

# --------------------------------------------------------------------------------------------
# Adaptateur vers finance_ve01 (J6). La VL du J2 est en rendement total ; le rapport lit une VL
# ex-distribution et des réinvestissements. L'adaptateur tire seulement le partage entre prix et
# distribution : VL ex = VL totale × Π (1 − taux de chaque distribution), rendement total inchangé.
# Rendement distribué annuel (%), tiré uniformément par fonds dans la plage de son archétype ;
# chaque versement (mensuel : taux ÷ 12 ; annuel : en décembre) porte un bruit log-normal.
# --------------------------------------------------------------------------------------------
[adapter]
distribute_all = ["monetaire"]         # verse chaque mois tout le gain du mois : VL ex à peu près constante
payment_noise_sigma = 0.15             # bruit log-normal d'un versement autour de son taux
capital_gain_share = [0.0, 0.25]       # part du gain de l'année au-delà du rendement versé, distribuée en décembre (0,4 → 0,25 le 2026-11-04 : F303 à 9,5 % en 2023)
december_window_days = 12              # versement annuel : jour ouvrable tiré dans les 12 derniers jours de décembre

[adapter.yield_pct]
obligations_canadiennes = [2.6, 3.4]
obligations_mondiales = [2.4, 3.2]
conservateur = [2.0, 2.8]
equilibre = [1.6, 2.4]
croissance = [1.0, 1.8]
actions_canadiennes = [2.4, 3.2]
dividendes_canadiens = [3.4, 4.4]
actions_americaines = [0.8, 1.4]
actions_mondiales = [1.0, 1.6]
actions_internationales = [2.0, 2.8]
marches_emergents = [1.6, 2.4]
petites_cap_nord_americaines = [0.4, 1.0]
technologie_mondiale = [0.0, 0.5]
actifs_reels = [3.2, 4.4]

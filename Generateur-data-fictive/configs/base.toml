# --------------------------------------------------------------------------------------------
# Marchés (moteur B). Modèle multifactoriel journalier ouvrable (lundi à vendredi, fériés non
# modélisés), à régimes latents et volatilité regroupée. Tout est paramètre de loi : aucune date,
# aucun rendement d'année civile. Les régimes se succèdent par une chaîne de Markov ; le régime
# initial est tiré dans sa loi stationnaire. Le moteur ignore les comptes et les versements.
# Unités : dérives et volatilités en % par an ; taux et écarts de crédit en points de base par an.
# --------------------------------------------------------------------------------------------
[markets]
method = "latent_multifactor_regime_switching"
trading_days_per_year = 252
shock_df = 5                           # Student-t des chocs de facteurs (queues épaisses), ν > 4
garch = { alpha = 0.07, beta = 0.91 }  # variance commune regroupée, moyenne 1 ; alpha + beta < 1

# Régimes : durée moyenne (mois, sortie géométrique), probabilités du régime suivant, puis paramètres
# du régime. equity_drift_pct = espérance de dérive du facteur actions mondiales pendant le régime ;
# vol_multiplier multiplie toutes les volatilités de facteurs, specific_vol_multiplier les seules
# composantes régionales (sous 1 : les marchés se corrèlent davantage). Sauts du facteur mondial :
# loi de Poisson (par an), taille log-normale [moyenne, écart-type] en %, des deux signes.
[markets.regimes.expansion]
mean_duration_months = 30
next = { ralentissement = 0.75, crise = 0.25 }
equity_drift_pct = 10.0
vol_multiplier = 0.85
specific_vol_multiplier = 1.0
rates_equity_rho = 0.25                # corrélation taux / actions : hausse des taux quand ça monte
yield_drift_bp = 20
credit_drift_bp = -15
fx_drift_pct = -1.0                    # USD contre CAD : un CAD qui se raffermit
style_drift_pct = { growth = 1.5, dividend = -0.5, quality = 0.0 }
jump_rate_per_year = 0.4
jump_size_pct = [0.3, 2.5]

[markets.regimes.ralentissement]
mean_duration_months = 10
next = { expansion = 0.55, crise = 0.45 }
equity_drift_pct = 0.0
vol_multiplier = 1.1
specific_vol_multiplier = 1.0
rates_equity_rho = 0.05
yield_drift_bp = -40
credit_drift_bp = 30
fx_drift_pct = 1.5
style_drift_pct = { growth = -1.0, dividend = 1.0, quality = 1.0 }
jump_rate_per_year = 0.8
jump_size_pct = [-1.0, 3.0]

[markets.regimes.crise]
mean_duration_months = 4
next = { reprise = 1.0 }
equity_drift_pct = -30.0
vol_multiplier = 2.0
specific_vol_multiplier = 0.8
rates_equity_rho = -0.40               # fuite vers la qualité : les taux baissent quand ça chute
yield_drift_bp = -150
credit_drift_bp = 180
fx_drift_pct = 8.0
style_drift_pct = { growth = -4.0, dividend = 2.0, quality = 3.0 }
jump_rate_per_year = 3.0
jump_size_pct = [-3.0, 4.0]

[markets.regimes.reprise]
mean_duration_months = 8
next = { expansion = 0.85, ralentissement = 0.15 }
equity_drift_pct = 22.0
vol_multiplier = 1.3
specific_vol_multiplier = 1.0
rates_equity_rho = 0.20
yield_drift_bp = 50
credit_drift_bp = -120
fx_drift_pct = -4.0
style_drift_pct = { growth = 3.0, dividend = -1.0, quality = -1.0 }
jump_rate_per_year = 1.2
jump_size_pct = [1.0, 3.0]

# Actions : facteur régional = beta × facteur mondial + composante propre. regional_drift_sigma_pct :
# écart propre à chaque région, tiré par graine (aucune région n'est gagnante par construction).
[markets.equity]
global_vol_pct = 12.5
regional_drift_sigma_pct = 2.0
regions = { canada = [0.85, 7.0], united_states = [1.0, 5.0], europe = [0.95, 8.0], asia_pacific = [0.9, 9.0], emerging = [1.05, 11.0], other = [0.9, 10.0] }   # [beta, volatilité propre %]

# Taux : un taux fantôme suit un processus d'Ornstein-Uhlenbeck (sans plancher) ; le taux observé en
# est le softplus, de lissage lower_bound_smoothing_bp : positif, proche du fantôme dès qu'il dépasse
# quelques fois ce lissage. Canada et reste du monde partagent common_share de leur variance. Pente : Δ(taux à D ans) = Δniveau
# + (D − 5) / 5 × Δpente. Crédit : la part credit_duration_share de la duration y est exposée.
[markets.rates]
canada_initial_pct = [1.0, 4.5]
global_initial_pct = [1.5, 4.5]
long_run_pct = [2.0, 4.0]
mean_reversion_per_year = 0.35
lower_bound_smoothing_bp = 20
canada_vol_bp = 75
global_vol_bp = 70
common_share = 0.7
slope_vol_bp = 45
short_spread_pct = [0.3, 1.0]          # taux court = niveau canadien − écart tiré
credit_vol_bp = 55
credit_equity_rho = -0.5
credit_duration_share = 0.35

[markets.fx]                           # un seul facteur de change (USD contre CAD) pour toute devise
vol_pct = 7.0
equity_rho = -0.35                     # le CAD faiblit quand les actions chutent

[markets.styles]                       # facteurs longs-courts ; « value » = − croissance
growth = { vol_pct = 5.0, equity_rho = 0.3 }
dividend = { vol_pct = 3.0, equity_rho = -0.3 }
quality = { vol_pct = 2.5, equity_rho = -0.2 }

[markets.real_assets]
vol_pct = 9.0
equity_beta = 0.6                      # part actions de la région dans un actif réel

# Fonds : écart de suivi par classe d'actifs ([min, max] % par an), pondéré par la part de la classe ;
# alpha brut ~ N(0, alpha_te_ratio × écart de suivi), jamais choisi ; sauts propres rares. Le RFG
# est déduit de la VL (une seule fois). VL de départ : log-uniforme, ou launch_nav au lancement.
[markets.funds]
tracking_error_pct = { equity = [2.5, 6.0], fixed_income = [0.7, 1.5], cash = [0.03, 0.10], other = [3.0, 6.0] }
alpha_te_ratio = 0.25
idiosyncratic_df = 6
jump_rate_per_year = 0.15
jump_sigma_pct = 3.0
initial_nav = [8.0, 40.0]
launch_nav = 10.0

# Repères : mêmes facteurs, alpha nul, aucun bruit propre, frais passifs explicites par classe.
# Composite de chaque fonds (ses expositions) ; politique de chaque institution (cibles initiales J1,
# rééquilibrage quotidien) ; deux repères de contexte, composition fixée ici d'avance.
[markets.benchmarks]
passive_fee_pct = { equity = 0.08, fixed_income = 0.06, cash = 0.03, other = 0.12 }

[markets.benchmarks.global_equity]
asset_class = { equity = 100 }
equity_geography = { united_states = 58, europe = 15, asia_pacific = 10, emerging = 10, canada = 4, other = 3 }

[markets.benchmarks.balanced]
asset_class = { equity = 55, fixed_income = 40, cash = 5 }
equity_geography = { canada = 30, united_states = 42, europe = 13, asia_pacific = 7, emerging = 6, other = 2 }
duration_years = 7.0

# Repères de catégorie (J6b) : le repère de chaque fonds dans le rapport (ref.repere). Composition fixe
# en style « marché large » : un profil mixte se compare à un équilibré de même part en actions
# arrondie à la dizaine ; un fonds d'actions, à l'indice large de sa géographie (dividendes et petites
# capitalisations compris : leur écart de style reste visible) ; revenu fixe, monétaire et actifs réels,
# à leur classe. Chaque archétype appartient à une seule catégorie ; une catégorie sans fonds n'est pas produite.
[markets.benchmarks.category.prudent]
name = "Profil prudent"
archetypes = ["conservateur"]
asset_class = { equity = 40, fixed_income = 55, cash = 5 }
